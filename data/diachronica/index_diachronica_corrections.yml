rules:
  - rule:
      id: Blackfoot-nr
      content: "nl → s"
      reason: "Corrected from original source: International Journal of American Linguistics, Vol. 55, No. 1, p 50"
  - rule:
      id: Blackfoot-ʔθ,ʔr
      content: "ʔθ, ʔr → {ʔ,j,∅}"
      reason: "Corrected from original source: International Journal of American Linguistics, Vol. 55, No. 1, p 50"
  - rule:
      id: Dena’ina-ʃʷ,x-z,ʒʷ,ɣ
      content: "{ʃ(ʷ),x} {z,ʒ(ʷ),ɣ} → s j"
      reason: "Corrected from original source: Northern Athapaskan Languages (Vol. 6), p. 73"
  - rule:
      id: Old-Irish-m̩-n̩
      content: "m̩ n̩ → am an / _{s,({m,j,w})V}"
      reason: "Bracket fix for env set with optional grouping"
  - rule:
      id: Spanish-—-Vdz
      content: "— Vdz → ∅ / {nts,ndz,rdz}_"
      reason: "Bracket fix - not confirmed from original source"
  - rule:
      id: Seneca-r_3
      content: "r → j / C[-glottal](h)_{o(ː),õ(ː)}"
      reason: "Bracket fix - not confirmed from original source"
  - rule:
      id: Seneca-ẽː
      content: "ẽ(ː) → e(ː) / _{e(ː),o(ː)}"
      reason: "Bracket fix - not confirmed from original source"
  - rule:
      id: Zayse-Zergulla-x3
      content: "x₂ → ɡ / V_#"
      reason: "x3 does not appear in the original source, x2 is a best guess"
  - rule:
      id: Proto-Dravidian-s_3
      content: "s → ∅ / #V_{r,ɾ,l}"
      reason: "Replacing with IPA symbols"
  - rule:
      id: Proto-Dravidian-r̀
      content: "{r,ɾ} → r"
      reason: "Replacing with IPA symbols"
  - rule:
      id: Proto-Dravidian-ŕ
      content: "{ɹ,ɾ} → r / V_V"
      reason: "Replacing with IPA symbols"
  - rule:
      id: Proto-Dravidian-n-nː-rn
      content: "n nː rn → {n,r} n(ː) ɳ / V_V"
      reason: "Replacing with IPA symbols"
  - rule:
      id: Proto-Dravidian-nː
      content: "nː → n(ː)"
      reason: "Replacing with IPA symbols"
  - rule:
      id: Proto-Dravidian-nr̀
      content: "n{r,ɾ} → nr"
      reason: "Replacing with IPA symbols"
  - rule:
      id: Yemsa-kʼ
      content: "kʼ → k / #_"
      reason: "This is a guess, it could be _# or _,#"
  - rule:
      id: Proto-Mongolic-tʃ_2
      content: "tʃ → d / #_"
      reason: "This is a guess, it could be _# or _,#"
  - rule:
      id: Old-Japanese-Vowel-Shift-u,ɨi-,a,i-ɨi,ia,ə-uɨ,a,ə
      content: "{u,ɨ}i {a,ə}i i{a,ə} u{ɨ,a,ə} → wi e je wo"
      reason: "Corrected from original source: https://conf.ling.cornell.edu/whitman/FrellWhitman.pdf"
  - rule:
      id: Old-Provençal-rdʒ
      content: "rdʒ → {rdʒ,rz}"
      reason: "Skipping intermediate step"
  - rule:
      id: Old-Provençal-rtVɡ
      content: "rtVɡ → {rdʒ,rs}"
      reason: "Skipping intermediate step"
  - rule:
      id: Old-Provençal-rtʃ-rdtʃ
      content: "rtʃ rdtʃ → {rts,rs} {rz,rts,rdʒ}"
      reason: "Skipping intermediate step"