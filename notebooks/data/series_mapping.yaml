# Per-section series label resolution for Index Diachronica imports.
# Longest-prefix section match wins; '*' acts as a global fallback.
#
# Keys are series-like tokens found in the HTML: s₁, s₂, s₃, x₁, x₂, h₁, h₂, sₓ, etc.
# Values are ASCA-valid targets:
# - single IPA segments (with diacritics allowed): ʃ, χ, kʷ
# - feature matrices: C:[+strident]
# - sets: "{ s, ʃ }" (ensure spacing like shown)
#
# NOTE: These are conservative defaults. Adjust per your sources.

"*":
  s₁: s
  s₂: z
  s₃: ʃ
  sₓ: "{ s, ʃ }"
  x₁: x
  x₂: χ
  h₁: h
  h₂: h
