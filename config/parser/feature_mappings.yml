  notes: "Index [+low falling tone] → ASCA [tone: 21]"
mid dipping tone:
  mapping_kind: tone
  asca_target: "214"
  confidence: high
  notes: "Index [+mid dipping tone] → ASCA [tone: 214]"
mid falling tone:
  mapping_kind: tone
  asca_target: "31"
  confidence: high
  notes: "Index [+mid falling tone] → ASCA [tone: 31]"
mid tone:
  mapping_kind: tone
  asca_target: "33"
  confidence: high
  notes: "Index [+mid tone] → ASCA [tone: 33]"
mid rising tone:
  mapping_kind: tone
  asca_target: "35"
  confidence: high
  notes: "Index [+mid rising tone] → ASCA [tone: 35]"
high rising tone:
  mapping_kind: tone
  asca_target: "45"
  confidence: high
  notes: "Index [+high rising tone] → ASCA [tone: 45]"
falling tone:
  mapping_kind: tone
  asca_target: "51"
  confidence: high
  notes: "Index [+falling tone] → ASCA [tone: 51]"
high falling tone:
  mapping_kind: tone
  asca_target: "51"
  confidence: high
  notes: "Index [+high falling tone] → ASCA [tone: 51]"
high tone:
  mapping_kind: tone
  asca_target: "55"
  confidence: high
  notes: "Index [+high tone] → ASCA [tone: 55]"
emphatic:
  mapping_kind: rename
  asca_target: rtr
  confidence: high
  notes:
    "Index [±emphatic] → ASCA rtr (note: emphatic is not present in the Index
    - the feature is created in manual_mappings"
fortis:
  mapping_kind: rename
  asca_target: tense
  confidence: medium
  notes: Index [+fortis] = ASCA [+tense]
lenis:
  mapping_kind: rename_invert
  asca_target: tense
  confidence: medium
  notes: Index [+lenis] = ASCA [-tense]
