#region pre-index rule normalisation cleanup
#endregion

#region index rule normalisation

#endregion

# positional cleanup steps

- from: " / (unless|when not) "
  to: " / ! "
  use_regex: True
  reason: replace prose
- from: " / near ħ ʕ"
  to: " / near {ħ,ʕ}"
  reason: convert to set notation

- from: "(dialects|regions|varieties)( (or|and) (dialects|regions|varieties))*"
  to: "dialects"
  use_regex: True
  reason: align dialect text

- from: "in( some| most| all| many)?( [a-zA-Z]+)?( and [a-zA-Z]+)* dialects"
  to: "in\\1\\2\\3 dialects"
  use_regex: True
  reason: align dialect text

#region class letter replacements
- from: " (/|!) (near|adjacent to) a vowel"
  to: " \\1 \\2 V"
  use_regex: True
  reason: replace prose

- from: " (/|!) (near|adjacent to) (another consonant|consonants)"
  to: " \\1 \\2 C"
  use_regex: True
  reason: replace prose
- from: " (/|!) (near|adjacent to) nasals"
  to: " \\1 \\2 N"
  use_regex: True
  reason: replace prose
- from: " (/|!) (near|adjacent to) a nasal vowel"
  to: " \\1 \\2 V[+nasal]"
  use_regex: True
  reason: replace prose
#endregion

#region feature replacements
- from: " (/|!) (near|adjacent to) gutturals"
  to: " \\1 \\2 [+laryngeal]"
  use_regex: True
  reason: replace prose
- from: " (/|!) (near|adjacent to) emphatics"
  to: " \\1 \\2 [+emphatic]"
  use_regex: True
  reason: replace prose
- from: " / unstressed"
  to: " / [-stress]"
  reason: replace prose
- from: " / stressed"
  to: " / [+stress]"
  reason: replace prose
#endregion

- from: " \\(→ (\\w+) dialectally\\?\\)"
  to: " → \\1 ; dialectal"
  use_regex: True
  reason: dialectal
- from: \(dialectally → (\w+)\?\)
  to: → \1 ; dialectal
  use_regex: True
  reason: dialectal
- from: “In contrast, Romanian exhibits
  to: ; “In contrast, Romanian exhibits
  reason: comment
- from: \(→ (\w+) ?\??\)
  to: → \1
  use_regex: True
  reason: chaining
- from: \((\w)\?\)
  to: (\1)
  use_regex: True
  reason: optional
- from: (\([^)]+ is rare\))
  to: ; \1
  use_regex: True
  reason: comment
- from: → (?)
  to: ""
  reason: unknown output
- from: bw mw → ɡw ŋw (→ ɡ ŋ / _V[+ rounded])
  to: bw mw → ɡw ŋw → ɡ ŋ / _V[+ rounded]
  reason: chaining
- from: nd ld (→ nː lː ?)
  to: nd ld → nː lː
  reason: chaining
- from: ɣ → q (more likely, *ɢ → q instead of → ɣ)
  to: ɣ → q ; (more likely, *ɢ → q instead of → ɣ)
  reason: comment
- from: " (/|!) at word boundaries"
  to: " \\1 #_, _#"
  use_regex: True
  reason: replace prose

#region adjacent replacements
- from: " (/|!) adjacent to ([A-Z])"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
- from: " (/|!) adjacent to (\\{[^}]+\\})"
  to: " \\1  \\2_, _\\2"
  use_regex: True
- from: " (/|!) adjacent to (\\w?\\[[^]]+\\])"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
#endregion

#region near replacements
- from: " (/|!) near ([A-Z])"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
- from: " (/|!) near (\\{[^}]+\\})"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
- from: " (/|!) near (\\w?\\[[^]]+\\])"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
#endregion

