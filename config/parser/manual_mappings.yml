- from: " / (unless|when not) "
  to: " / ! "
  use_regex: True
  reason: replace prose
- from: ATR
  to: atr
  reason: Lowercase feature name
- from: RTR
  to: rtr
  reason: Lowercase feature name
- from: (h → ɦ?)
  to: ""
  reason: remove ambuguous text
- from: " ʰS "
  to: " Sʰ "
  reason: typo?

#region align positional text
- from: " / near ħ ʕ"
  to: " / near {ħ,ʕ}"
- from: " / if s or z occur "
  to: " / near {s,z} ; if s or z occur "
- from: " next to "
  to: " adjacent to "
- from: " / syllable-initially"
  to: " / $_ "
# - from: " / (_[\\w]+) \\(possibly only (word-)?initially\\??\\)"
#   to: " / #\\1, \\1" # TODO: how to handle alternative, optional envs?
#   use_regex: True
- from: " / if ɑ(ː) is elsewhere in the word"
  to: " / near ɑ(ː) ; if ɑ(ː) is elsewhere in the word"
- from: " æ(ː) / else (sometimes it seems more like ɛ(ː) to me)"
  to: " {æ(ː),ɛ(ː)} / else"
- from: " / in coda"
  to: " / :{ _#, _% }: ; in coda" # TODO: this is a hack to handle coda envs
- from: "_ or when _"
  to: "_, _"
- from: "_ or _"
  to: "_, _"
- from: " / intertonic"
  to: " / %[+str]_%[+str]" # TODO: needs confirmation
#endregion

#region dialect text cleanup
- targets:
    - " in (Mentasta Ahtna)"
    - " in ((West|East) Swampy Cree)"
    - " in (Nelemwa)"
    - " (Pije and Fwai)"
    - " in (Ware Sekani)"
    - " in (Queensland( and New South Wales)?)"
    # - " \\(in (Languedoc)\\)"|varieties
  to: " in \\1 dialects"
  use_regex: True

# TODO: need to handle singular cases without breaking other rules
- from: "(dialects|regions|varieties)( (or|and) (dialects|regions|varieties))*"
  to: "dialects"
  use_regex: True

- from: "in(?: the)?( some| most| all| many)?( [a-zA-Z]+)?( and [a-zA-Z]+)* dialects"
  to: "in\\1\\2\\3 dialects"
  use_regex: True
#endregion

#region feature and class letter replacements
- from: " (/|!) (near|adjacent to) a vowel"
  to: " \\1 \\2 V"
  use_regex: True
- from: " (/|!) (near|adjacent to) (another consonant|consonants)"
  to: " \\1 \\2 C"
  use_regex: True
- from: " (/|!) (near|adjacent to) nasals"
  to: " \\1 \\2 N"
  use_regex: True
- from: " (/|!) (near|adjacent to) a nasal vowel"
  to: " \\1 \\2 V[+nasal]"
  use_regex: True
- from: " (/|!) (near|adjacent to) gutturals"
  to: " \\1 \\2 [+laryngeal]"
  use_regex: True
- from: " (/|!) (near|adjacent to) emphatics"
  to: " \\1 \\2 [+emphatic]"
  use_regex: True
- from: " / unstressed"
  to: " / [-stress]"
- from: " / stressed"
  to: " / [+stress]"
- from: " / if short and unstressed"
  to: " / [-long, -stress]"
- from: " / _Ra (short a only), "
  to: " / _Ra[-long] ; "
- from: C[+ affricate]
  to: A
- from: "high(er)"
  to: "hi"
- from: + A POA
  to: α place
  reason: Point of articulation - asca syntax alpha notation
- from: + B POA
  to: β place
  reason: Point of articulation - asca syntax alpha notation
- from: "[anything]"
  to: "[]"
  reason: Use asca syntax for a wildcard symbol
#endregion

- from: " \\(→ (\\w+) dialectally\\?\\)"
  to: " → \\1 ; dialectal"
  use_regex: True
  reason: dialectal
- from: \(dialectally → (\w+)\?\)
  to: → \1 ; dialectal
  use_regex: True
  reason: dialectal
- from: \(→ (\w+) ?\??\)
  to: → \1
  use_regex: True
  reason: chaining
- from: \((\w)\?\)
  to: (\1)
  use_regex: True
  reason: optional
- from: (\([^)]+ is rare\))
  to: ; \1
  use_regex: True
  reason: comment
- from: → (?)
  to: ""
  reason: unknown output
- from: bw mw → ɡw ŋw (→ ɡ ŋ / _V[+ rounded])
  to: bw mw → ɡw ŋw → ɡ ŋ / _V[+ rounded]
  reason: chaining
- from: nd ld (→ nː lː ?)
  to: nd ld → nː lː
  reason: chaining
- from: ɣ → q (more likely, *ɢ → q instead of → ɣ)
  to: ɣ → q ; (more likely, *ɢ → q instead of → ɣ)
  reason: comment
- from: " (/|!) at word boundaries"
  to: " \\1 #_, _#"
  use_regex: True
  reason: replace prose

#region adjacent replacements
# - from: " (/|!) adjacent to ([A-Z])"
#   to: " \\1  \\2_, _\\2"
#   use_regex: True
#   reason: replace prose
# - from: " (/|!) adjacent to (\\{[^}]+\\})"
#   to: " \\1  \\2_, _\\2"
#   use_regex: True
