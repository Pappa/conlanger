#   to: " \\1  \\2_, _\\2"
#   use_regex: True
#   reason: replace prose
#endregion

#region near replacements
- from: " (/|!) near ([A-Z])"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
- from: " (/|!) near (\\{[^}]+\\})"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
- from: " (/|!) near (\\w?\\[[^]]+\\])"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
- from: " (/|!) near (\\w?\\([^)]+\\))"
  to: " \\1  \\2_, _\\2"
  use_regex: True
  reason: replace prose
#endregion

#region sporadic - TODO: change this to attach to the environment
- from: " (/|!) in ([\\w ]+) dialects"
  to: " \\1 dialectal ; in \\2 dialects"
  use_regex: True

- targets:
    - " / (in certain situations)"
    - " (in certain frequently-used words)"
    - " / (“in some positions”)"
    - " / (except in several)"
    - " / (depending on the environment)"
    - " / (\\(“when in unstressed penult)"
    - " / (some sequences)"
    - " / (sometimes)"
    - " / (in Form VI)"
    - " / (“\\[b\\]etween the last two vowels of a proparoxytone”)"
    - ", (except in certain)"
    - ", (in the feminine ending)"
  to: " / sporadic ; \\1"
  use_regex: True
  reason: sporadic environment

- from: " (in southern dialects"
  to: " sporadic ; (in southern dialects"
- from: " (in some dialects"
  to: " sporadic ; (in some dialects"
- from: " (some dialects"
  to: " sporadic ; (some dialects"
- from: " (most dialects"
  to: " ; (most dialects"
- from: " / except when CV_V in U"
  to: " / sporadic ! CV_V ; except when CV_V in U"
- from: " / in prefixes related to"
  to: " sporadic ; / in prefixes related to"
  reason: unhandled positional environment
# - from: " ! in Ware Sekani"
#   to: " sporadic ; not in Ware Sekani"
# - from: " ! in Queensland"
#   to: " sporadic ; not in Queensland"
- from: " (some exceptions"
  to: " ; sporadic (some exceptions"
- from: " for some C"
  to: " ; sporadic ; for some C"
- from: " (rare) ! form of "
  to: " / sporadic ; (rare) ! form of "
- from: " / ! if one of the above"
  to: " / sporadic ; ! if one of the above"
- from: " yj (→ yː sometimes)"
  to: "{yj,yː}"
- from: " (→ i in most descendants"
  to: " → i / sporadic ; (→ i in most descendants"
  reason: workaround - we can't handle different envs for chained rules
- from: " (conditioning unclear)"
  to: " / sporadic ; (conditioning unclear)"
- from: " / if ʃ is somewhere"
  to: " / sporadic ; if ʃ is somewhere"
  reason: interim non-local co-occurrence env until issue 122 structured conditioning
- from: " / if ʒ is somewhere"
  to: " / sporadic ; if ʒ is somewhere"
  reason: interim non-local co-occurrence env until issue 122 structured conditioning
- from: (kʷ → ɡʷ → ɡ ?)
  to: kʷ → ɡʷ → ɡ / sporadic ; (kʷ → ɡʷ → ɡ ?)
  reason: workaround
- from: " / in two cases cited"
  to: " / sporadic ; in two cases cited"
- from: " / in some "
  to: " / sporadic ; in some "
- from: " / in diminutives"
  to: " / sporadic ; diminutives"
  reason: unhandled positional environment
- from: " / in nominal suffixes"
  to: " / sporadic ; nominal suffixes"
  reason: unhandled positional environment
- from: " / in nouns"
  to: " / sporadic ; in nouns"
  reason: unhandled positional environment
- from: ", in some words"
  to: " sporadic ; in some words"
- from: " / in “"
  to: " / sporadic ; in “"
- from: " / possible exception"
  to: " / sporadic ; possible exception"
- from: " / unclear conditioning"
  to: " / sporadic ; unclear conditioning"
- from: " (except in the"
  to: " / sporadic ; (except in the"
- from: "“under to [sic] the influence of neighboring consonants”"
  to: "/ sporadic ; “under to [sic] the influence of neighboring consonants”"
- from: ", in monosyllables"
  to: " / sporadic ; in monosyllables"
- from: " / in monosyllables"
  to: " / sporadic ; in monosyllables"
- from: " / pretonic"
  to: " / sporadic ; pretonic"
  reason: unhandled positional environment
- from: " / posttonic"
  to: " / sporadic ; posttonic"
  reason: unhandled positional environment
- from: " if {M,Vː} " # TODO: change this to handle "previously in the word" or similar
  to: " / sporadic ; if {M,Vː} "
  reason: unhandled positional environment
- from: " ! some monosyllables"
  to: " ; sporadic ! some monosyllables"
- from: ", often"
  to: " ; sporadic - often"
#endregion

#region comment handling
- targets:
    - " (Do not necessarily"
    - " (remains "
    - " (“[a]rchaic relic”)"
    - " (again, "
    - " (Blevins "
    - " (Whimemsz "
    - " (first change marked "
    - " (not sure what "
    - " “(before a prefix; "
    - " (note that "
    - " (?; included here based on "
    - " (at least one instance of "
    - " (velar fricative is conjectured"
    - " (fricative changes to approximant)"
    - " (→ b seems more common)"
    - " (specifically"
    - " (*)"
    - " “("
    - " (“"
    - " (seems to "
    - " (this second one"
  comment: true
- from: "#, though "
  to: "# ; though "
- from: " / plain t only"
  to: " ; plain t only"
#endregion

