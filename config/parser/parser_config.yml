    "*R": "R"
    "*T": "T"
    "*Z": "Z"
    "*j": "j"
    "*r": "r"
    "*c": "c"
    # "*J": "J"
  "35":
    "1": "[+low tone]"
    "2": "[+mid tone]"
    "3": "[+high tone]"
  "29.1.1.1":
    # "RTR": "rtr"
    "TŁ": "[+lateral]" # laterals
    "TŠ": "[+cons, +dist, +fr, -bk, +hi, -lo]" # palatals
    "TŠʷ": "[+cons, +dist, +fr, -bk, +hi, -lo, +labial]" # labialized palatals
    "TS": "{[+cons, -son, -cont, +cor, +anterior, +dist, +delrel], [+cons, -son, +cont, +cor, +anterior, +dist, -delrel]}" # dental affricates and fricatives
    "K": "[+cons, -son, -cont, -cor, +fr, -bk, +hi, -lo]" # front (palatalized) velars
    "T": "[+cons, -son, -cont, +cor, +anterior, +dist]" # dental stops
    # "Q": "uvulars"
    # "Qʷ": "labialized uvulars"
