- section: Siouan-Iroquoian
  index: '37'
  citation: 'Based upon Julian and Chafe, Proto-Siouan-Iroquoian, if it existed, appears to have had the following phonetic inventory: For this following section, the sound transcribed here as 〈r〉 may in actuality represent something akin to /ɹ/. Siouan-Iroquoian, and for that matter the inclusion of Yuchian and Caddoan within the former and the latter, respectively, is far from universally accepted; their inclusion here is in large part due to the available sources giving correspondences for each. It was unknown whether Proto-Caddoan was the same as the Proto-Iroquois-Caddoan indicated in Cafe’s paper, so the Caddoan changes have been presented after the main Iroquoian changes. Per KneeQuickie, Whimemsz wishes to “[n]ote that Siouan-Iroquoian is a proposed, rather than firmly-demonstrated, language grouping”. (From Chafe, Wallace L. (1964), “Another Look at Siouan and Iroquoian”. American Anthropologist New Series, 66:852 – 862; Julian, Charles (2010), “A History of the Iroquoian Languages”, University of Manitoba,
    Winnipeg; and from cedh aumdmanh’s Iroquoian changes)'
