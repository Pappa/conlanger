  citation: Pogostick Man, from Wikipedia contributors (2012), “Southern American English”. “Lax and tense vowels often neutralize before /l/” Stress reassignment to the initial syllable (again, not strictly a vowel shift) Merger of ɔɹ and ɑɹ (“in some regions”) Loss of distinction between ɪɹ and ɪəɹ, and between ʊəɹ and ɔɹ Pronunciation of the 〈l〉 in words like 〈walk〉 and 〈talk〉 (again, not really a vowel development)
  rules:
  - input: ɛ
    output: ɪ
    env: _N
  - input: aɪ
    output: a:[+long]
    env: _#
  - input: aɪ
    output: a:[+long]
    env: _C:[+voice]
  - input: aɪ
    output: ɑe:[+long]
    env: (only for some speakers)
  - input: aɪ
    output: a:[+long]
    env: (only for some speakers)
  - input: '{ æ, ɛ, ɪ }'
    output: '{ æj(ə), ɛj(ə), ɪj(ə) }'
  - input: '{ ɛj(ə), ɪj(ə), i, eɪ }'
    output: '{ ej(ə), ij(ə), ɪi, ɛi }'
  - input: uʊ oʊ
    output: ʉʊ̈ əʊ̈ (a bit of a guesstimate based upon the prose description in the article and the mean-formant-value chart cited from Labov,:[+affricate]sh &:[+back]obert (2006))
  - input: ɔ
    output: ɑɒ (for some speakers)
  - input: ɑɹ
    output: ɒɹ (“often”)
  - input: z
    output: d
    env: _n (not strictly a vowel shift but included here anyway because it’s cool, and also because it doesn’t occur in 〈hasn’t〉 because of the influence of 〈hadn’t〉)
  - input: æ/ɑ:[+long]
    output: æɪ
- section: Most-Wanted Sound Changes
  index: '47'
  citation: 'This section replicates the “Most wanted sound changes” article from Knee Quickie. It is presented mostly as it was found with the following modifications:'
- section: 'List 1: Simple Consonant Changes'
  index: '47.1'
  rules:
  - input: w
    output: p (Navajo, some Polynesian languages)
  - input: kʲ ɡʲ
    output: k ɡ (P:[+voice]anish)
  - input: ś
    output: k (Possibly unconditional; some Samoyedic langs)
  - input: pʲ
    output: kʲ (some Somanian dialect͡s, P:[-voice]sakonian)
  - input: t͡s
    output: t (unconditional; some Samoyedic langs)
  - input: t
    output: k (general Polynesian)
  - input: n
    output: ŋ (Samoan, but only in colloquial speech)
  - input: j
    output: p (some Polynesian languages, such as Levei and P:[+voice]rehet) (https://en.wikipedia.org/wiki/Proto-:[+affricate]ustronesian_language)
  - input: b
    output: '#c, -nc- (Sundanese)'
  - input: ŋ
    output: '{x,h} (various Mayan languages)'
  - input: h
    output: ŋ (Nyole)
  - input: ʕ
    output: ŋ (allegedly in:[+front]uropean:[+laryngeal]ebrew, both Sephardic and:[+affricate]shkenazi, but possibly not a sound change so much as a substitution) (https://en.wikipedia.org/wiki/[+laryngeal]ebrew_language#Varieties_of_ayin, http://sites.google.com/site/londonsephardiminhag/pronunciation, http://www.forward.com/articles/105938/)
  - input: f
    output: p (? claimed to have occurred independently in Proto-Semitic and Proto-Omotic, and to a limited extent in:[+front]gyptian (but this may be related to the Semitic change); note that the:[+approximant]ikipedia article is cited to a single source and that source is admittedly theoretical, and acknowledges on page 77 another reconstruction that doesn’t believe Proto-:[+affricate]fro-:[+affricate]siatic had /f/ at all) (Page 77 of http://is.gd/[+approximant]NyXdn, https://en.wikipedia.org/wiki/Proto-:[+affricate]fro-:[+affricate]siatic_language)
  - input: tš
    output: t (general:[+back]altic-Finnic; may not be unconditional but was certainly the most common outcome)
  - input: r
    output: ɡʟ
  - input: ɡʟ
    output: ɣ ([+laryngeal]iw) (http://is.gd/jCP:[+voice]LO1)
  - input: mb nd
    output: ʙ dr (Nias)
- section: 'List 2: Conditional or complex consonant changes'
  index: '47.2'
  citation: 'Western and Eastern Armenian often have swapped voicing in stop consonants: e.g. vardapet vs. vartabed. This is a result of changes related to aspiration.'
  rules:
  - input: w
    output: f (Common Celtic; I’m not sure of the conditions)
  - input: m
    output: n
    env: _i (P:[-voice]sakonian)
  - input: '{t,k}'
    output: ∅
    env: V_V (Marathi) probably with voiced stops as intermediates, since they also became silent
  - input: p
    output: w
    env: V_V (Marathi)
  - input: '{ b, d, ɡ }'
    output: '{ b:[+long], d:[+long], ɡ:[+long] }'
    env: V_V (some dialect͡s of Italian; there may be more to it than this, since words like repubblica are in standard Italian and not just dialect͡s)
  - input: t
    output: k
    env: '_s̩ (O:[+long]gami) (N:[+back]: P:[-voice]he article doesn’t have an underscore indicating whether this occurs before or after the /s̩/, but the linked page indicates where this change occurred) (http://amritas.com/101023.htm#10192359)'
  - input: n
    output: i
    env: _s and
