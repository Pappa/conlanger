- section: Muskogean
  index: '28'
  citation: 'The following Proto-Muskogean phonemic inventory is adapted from Wikipedia contributors (2016), citing Booker (2005). In addition, Booker (2005) posits two phonemes of unknown value. These phonemes dropped out in all positions in Eastern Muskogean, and only survived in the final syllable in Western Muskogean, where they yielded a glottal stop (/ʔ/) and a glottal fricative (/h/) before developing further in the respective languages. I have termed the progenitor phonemes “weak” (namely C₁[+ weak] and C₂[+ weak]). (I tentatively hypothesize that these were *ʔ *h, respectively, but am not sure.) I would like to take the unusual step of asking for help. I had to go to the library to find Booker’s paper, and in my notes I failed to write down the languages for which the following sound changes occurred: If anyone has a copy of Booker’s paper and can double-check, please contact me via one of the methods listed in the appropriate section. (From Wikipedia contributors (2016), “Muskogean languages”. Wikipedia,
    the Free Encyclopedia.'
  rules:
  - input: l
    output: j
    env: a_i
  - input: k
    output: ∅
    env: V_C
    exception: penult
  - input: V
    output: V̂:[+long]
    env: _Cko, ko lost?
