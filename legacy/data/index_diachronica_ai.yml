- section: Altaic
  index: '8'
  citation: 'The Wikipedia gives the following reconstruction, slightly adapted, for a hypothetical Proto(-Macro)-Altaic language, citing Blažek (2006) citing Sarostin et al. (2003) and porting over into IPA: *z would only have ever existed word-initially; *r and *j would only have been medial. In addition, Proto-(Macro-)Altaic also is thought to have had a bitonal pitch-accent system, with the syllable carrying the tone. It is important to note that the Altaic grouping is highly controversial and is not accepted by many mainstream linguists. (From Wikipedia contributors (2011), “Altaic languages”. Wikipedia, the Free Encyclopedia.'
