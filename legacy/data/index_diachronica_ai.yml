- section: Athabaskan
  index: 29.1.1.1
  citation: 'Wikipedia gives the following reconstructions, adapted from Cook (1981), Krauss & Golla (1981), Krauss & Leer (1981), and Cook & Rice (1981) for the consonants and from Leer (2005:284) for the vowels; the vowel phonemes in parentheses are reduced. In addition, though it is not encountered in these changes, there is a phoneme that crops up in forms of the first-person singular pronoun which has various reflexes in many Athabaskan languages; Krauss (1976b) represents it as *$. Leer transcribed it as *šʸ in 2005:284 but in 2008 opted to use the *$ transcription. The great majority of changes in this section are for the respective series of consonants, not for individual ones; therefore, changes specific to single consonants are marked so, and the reader should assume that unless explicitly stated, all of the following changes apply to the entire consonantal series. At the recommendation of Jan Strasser, the following conventions will be used to refer to the series; these are based on the abbreviations
    Whimemsz gave on the original Correspondence Library page, derived from the voiceless members of each series: (From Whimemsz’s statements from the TCL thread and Wiki, and from Wikipedia contributors (2011), “Athabaskan languages”. Wikipedia, The Free Encyclopedia.'
