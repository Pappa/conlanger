- section: Macro-Arawakan
  index: '22'
  citation: 'Dixon (2004) gives the following reconstruction for Proto-Arawá: Dixon states “[i]t is likely that, as in modern languages, *o ranged over [u] and [o]”. Further, he notes that “*w could have been a voiced bilabial fricative [β], or a labial-velar semivowel [w] (or could have had both as allophones), and *j could have been a voiced alveolar affricate [dz], a voiced postalveolar affricate [dʒ], or a voiced palatal stop [ɟ]”. Dixon also hypothesizes that there was an Arawán language that eventually died out after gaining substrate status; he has attempted to identify sound changes from Proto-Arawá to this hypothetical language. While most likely incomplete his findings are presented below along with those of the other languages. (From Dixon, R.M.W. (2004), “Proto-Arawá Phonology”. Anthropological Linguistics 46(1):1 – 83)'
