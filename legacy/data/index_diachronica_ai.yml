- section: Proto-Indo-European to Old Irish
  index: 17.5.1
  citation: 'dhokarena56 “Laryngeal rules (the ones common to all branches except Anatolian)” Obstruent clusters assimilate in voicing to that of the final obstruent Stress change: — Pronouns, articles, and conjunctions become unstressed. — First syllables stress in all verbal imperatives. — First syllables stress in all other parts of speech except preverbs and the exceptions noted above. — Second syllables receive stress otherwise. — “This, unlike the preceding rules, remained a morphologically conditioned rule in Old Irish.” “The following three rules only apply if the vowel is unstressed”: “The following two rules apply if the vowel in question is stressed or follows the stressed syllable”; consonant clusters cannot be /nt nd/: For the following: “The book says nothing about length in the input vowels, but I think they could be either short or long from the examples given.” “The following changes. . .are, quoth the book, ‘somewhat approximative’”: — “[A] sequence of two plosives becomes a geminate of the second
    one” The second and third rule below “may well have been for the most part optional”; every one of the three “only applies to unstressed vowels” and “remained as a phonologically conditioned rule”:'
