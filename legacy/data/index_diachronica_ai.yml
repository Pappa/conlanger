- section: Tanoan
  index: '39'
  citation: 'Proto-Tanoan is reconstructed as having had the following consonantal phonology, at least for phones in initial position: Only initials are reconstructed here. Vowels are believed to have had nasality and possibly length, though no correspondences are given here for sure. The affricates, as per Hale (1967), appear to have patterned as stops. (From Hale, Kenneth (1967), “Toward a Reconstruction of Kiowa-Tanoan Phonology”. International Journal of American Linguistics, 33.2:112 – 120; and Wikipedia contributors (2012), “Tanoan languages”. Wikipedia, the Free Encyclopedia.'
