- section: Great Ngamo Tone Shift
  index: '46.6'
  citation: Pogostick Man, from Schuh, Russel (2005), “The Great Ngamo Tone Shift” In the Gudi dialect, the tone on a given domain (which can be more than one syllable/mora, as long as said syllables/morae are consecutive and share the same tone) shift to the following domain, with a low tone cropping up on the first domain. The original tone of the word-final domain floats or tacks itself onto the next domain, depending upon the surrounding conditions. When utterance-final, these tones remain on that domain. This can cause a falling tone, but not a rising tone, which Ngamo does not permit; where such would occur, tone goes to high.
