- section: Proto-Slavic to Polish
  index: 17.11.1
  citation: 'Xiądz Faust, in http://pittmirg.ovh.org/inne/psc.pdf http://pittmirg.ovh.org/inne/psc.pdf, mainly citing Klemensewicz et al. (1955), “Gramatyka historyczna języka polskiego”, and Dubisz and Długosz-Kurczabowa (2003?), “Gramatyka historyczna języka polskiego” NB: The original document heavily uses Slavistic notation as opposed to IPA; I’ve done the best I could in figuring this stuff out but be warned of possible errors. Havlik’s law: — “[H]owever: in the vicinity of *j the development of yers did not comply with the aforementioned law” Mobile stress → initial stress → penultimate stress (in most areas) Sporadic (de)nasalization of vowels; “there were certain environments which favoured nasality changes: in the vicinity of nasal consonants. . .and before sibilants” “The following sections are structured according to respective sound change types without much chronology, as the sound changes tend to sporadic, irregular or inconsistent or to be trends spreading over considerable time spans.” Oscillations
    involving: — Dentals and postalveolars — Postalveolars and alveolopalatals — Voicing Regressive voicing/devoicing of obstruents in consonantal clusters “Oscillations between dental and alveo[lo]palatals” / _C “Insertion of epenthetic vowels” in some situations, typically one of /ɛ u/, the latter written as either 〈u〉 or 〈ó〉 Epenthetic d ɡ appears in some circumstances'
