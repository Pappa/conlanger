    output: u (some mainland Greek dialect͡s, and P:[-voice]sakonian; this particular sound change has been said in some places to be impossible) (https://en.wikipedia.org/wiki/P:[-voice]sakonian_language#Consonant͡s)
  - input: i u
    output: s̩ f̩ (O:[+long]gami) (http://amritas.com/101023.htm#10192359)
