  citation: McAlpin (1974) reconstructs Proto-Elamo-Dravidian as having the following phonemic inventory; the following table is slightly modified for reasons to be explained. What here is denoted *s the author has *š for, but no other sibilant is readily identifiable in his paper. He makes mention of language written in cuneiform which may have influenced this convention. The phonemes *r̀ and *ŕ seem to have been contrastive rhotics. In *NS clusters, the nasal appears to have assimilated to the following stop. (From McAlpin, David W. (1974), “Toward Proto-Elamo-Dravidian”. Language 50(1):89 – 101)
