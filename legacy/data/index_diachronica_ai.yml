- section: Indo-European
  index: '17'
  citation: 'Wikipedia gives the following phonological reconstruction for Proto-Indo-European, reproduced here with some slight adjustments for presentation’s sake: There is some debate as to whether the voiced and voiced aspirate stops were actually glottalized and plain voiced, respectively; the status of the palatovelars, plain velars, and labiovelars as possible plain velar, uvular, and labialized uvular consonants, or as to whether the labiovelars existed at all, are also subjects of much contention. It is noted in the source that the nasals, approximants, and potentially laryngeals could also act as vowels; such allophones of /j w/ would then be [i u]. There is some debate over the presence of /a aː/ in the language, although the Wikipedia does mention that if Stang’s law holds, /aː/ at least must have been phonemic. The accentual system was apparently a sort of free pitch accent, heavily related to ablaut and the vestiges of which may be best seen in Vedic Sanskrit, Ancient Greek, and Lithuanian and some
    West South Slavic tongues. (From Wikipedia contributors (2011), “Pitch accent”. Wikipedia, The Free Encyclopedia.'
