- section: Vulgar Latin to Old Provençal
  index: 17.12.1.1.6
  citation: "Pogostick Man, from Grandgent, Charles Hall (1905), An outline of the phonology and morphology of old Provençal, Revised Edition NB: Use at your own peril. Trying to put a chronology to this is sort of like what I imagine undergoing a root canal would be like, as is figuring out the conditioning on a lot of these things because of the convention Grandgent uses. Nevertheless, I have triedâ\x80\x94and probably largely failed. In any case the sections regarding the development of the vowels are placed first, because the source does that and other Romance changes posted here do similarly, and the grouping of the consonants is in large part informed by the surce. Also, I use % here to denote a syllable boundary because I didn’t want to have to open yet another window so I could throw a sigma into my document. Stress shift: Secondary stress shifts to two syllables away from the penult. If the secondary tonic precedes the tonic, that vowel is considered stressed for the purpose of subsequent sound changes,\
    \ and at some point the intervening vowel drops. Vowel changes assume the changes in Vulgar Latin as listed elsewhere in this thread. STRESSED VOWELS UNSTRESSED VOWELS INITIAL-SYLLABLE VOWELS — Lots and lots of analogical formations INTERTONIC VOWELS PENULT VOWELS — V often remained when {tʃ,dʒ,j}_, especially if CC_, or when {(k)s,sː,sj}_ — V is retained when P_C[+dental] FINAL VOWELS — (Again, /a/ seems to be a persistent exception to these) — Grandgent remarks that /i/ was probably the last vowel to drop out — /i/ and /u/ remain when ”V_ (then u is subject to the changes listed above—u → y, &c.) — -os remains “in the extreme east” — Final -i remains “as late as the 12th century” in some regions (Aude, Tarn, Aveyron, Corrèze, and some pockets of Haute-Garrone) — Epenthesis of /e/ in 2sg “of some verbs” —— C_L, P_C[+dental], C_tʃ, C_k, C_m, C_n where “originally separated by the vowel of the penult” (proparoxytones) —— Ḱ_r (paroxytones) —— Where the cluster would be unwieldy otherwise, apocope happened ——\
    \ Final /(m)bj mnj pj mj/ “required a supporting vowel” (dialect-dependent) Loan phonemes: — Loaned /b/ did not lenite — Loaned /k/ did not palatalize Greek /k/ shows up variously as /k ɡ/ Some reanalysis of initials as medials if a prefixed form was reanalyzed as a single morpheme rː~r stuff—not sure what was going on here, but it seems like this distinction lingered on into the literary period, but the two may have been in the process of merging The outcome of ps varied; some dialects preserved it, while others changed it to (i)ʃ (typical of the west), us (the east), or is Some dialects dropped all final k, while others only dropped it when B_#, changing it to i when {a,E}_# The outcome of final nt was usually n, but in the extreme north and some areas of the south, the full cluster was kept as part of the ending -ant; further, “in some dialects the n fell after o, u”"
