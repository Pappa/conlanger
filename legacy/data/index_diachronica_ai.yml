- section: Uto-Aztecan
  index: '43'
  citation: 'The Wikipedia provides the following reconstruction for the phonology of Proto-Uto-Aztecan, which here is adapted with slight modifications as to the layout: Quoth the Wiki, “*n and *ŋ may have actually been *l and *n, respectively.” It should be noted that there exists some discrepancy between this given reconstruction and in that set up for the studies deriving the reconstructions below. Radius Solis includes *h and *l as distinct phonemes as per the source he cited. For the following Uto-Aztecan changes, Vᵤ, Vₛ, and Vₙ refer to normal (“unaffecting”), “suspending”, and “nasalizing” vowels, respectively. According to Radius Solis, “Reconstructed PUA had three sets of vowels; this book calls them ‘suspending’, ‘unaltering’, and ‘nasalizing’. The nasalizing vowels likely were actually nasal, but it’s uncertain; their existence was deduced only by the sound changes that revolved around them. There’s few good guesses yet about the nature of the ‘suspending’ vowels, but their existence is likewise deducible
    from the sound changes that have been affected by them across a majority of the UA family - more changes than from the nasalizing series, occurring in all UA branches, enough to be pretty certain that it was a reality in PUA.” (From Wikipedia contributors (2011), “Proto-Uto-Aztecan language”. Wikipedia, the Free Encyclopedia.'
