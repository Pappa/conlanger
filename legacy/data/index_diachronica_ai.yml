- section: Proto-Basque to Basque
  index: '44.2'
  citation: 'Pogostick Man, from Egurtzegi, Ander (2013), ”Phonetics and Phonology”, in Basque and Proto-Basque. Pre-Proto-Basque may have had some stuff involving reduplication that ended up dropping the first consonant fortis → aspirated / “in a prominent position” (i.e., word-initially?) fortis → [- voice] / else lenis → devoiced / “in a prominent word-initial position” lenis → voiced fricative (→ approximant, at least by the 12th Century?) / unstressed lenis (voiced) → fricative / {l,r,s̺,s̻,V}_{l,r,s̺,s̻,V} — At least one reconstruction seems to indicate *s and *ś, which may have been an affricate and /s/. Pretty reliably, *-s tends to turn into -ts̺, and *-ś → -ts̻, probably after the below-mentioned affrication. Beyond that, it’s messy. *-tso seems to have become -tʃo/-tʃu, though. “[T]wo similar vocalic segments” usually contract, though some dialects (especially Biscayan) seem not to exhibit this “[S]ome variations between /a/ and /e/ or /e/ and /i/” / _l{C,#} *h may have metathesized given that it’s only
    found in the first two syllables of proto-forms Vowel syncope: Something about final devoicing of stops and initial stops losing voicing as a result of vowel deletion “-a or -e from the definite article” is dropped Markina Biscayan and Getxo Biscayan Some vowel metathesis only when vowels are matched in height Something about diphthongs occurring where intervocalic /n/ was lost Glide dissimilation if the homorganic vowel was in the following syllable, but usually the glide just deleted Some speakers (Labourd and Low Navarrese?) have ʀ for r, and a few have ɢ̆ for ɾ l gets a velar(ized?) articulation in Souletin (possibly only in the coda?) Souletin preserves something involving historical aspiration in pretonic position, apparently Souletin keeps initial ʃ- and tʃ- distinct; Labourdin only has ʃ-, and the rest apparently only have tʃ-? From the Wikipedia article on Biscayan: “Convergence of sibilants: z, x and s > x, s and tz, tx and ts > tz.” I’m not sure what this means. 〈s z〉 are apparently s̻ s̺, and 〈x〉
    is ʃ. Beterri Guipuscoan has VjV# where Biscayan has VɲV# and regular Basque has VV# Accentual changes: — Navarrese and Labourdin seem to have gotten rid of phonemic accent; High Navarrese typically stresses the penult, while Low Navarrese and Labourdin are claimed to lack stress on the word level. — Guipuscona, southeastern Biscayan, and western varieties of Navarrese stress the second syllable (unless it is a disyllable, in which case the first syllable gets the accent, though a few varieties don’t do this). — North Biscayan does something with roots and affixes marked for prosody; ”[m]ost native roots and almost all singular affixes are unaccented”; loans, ”compounds and plural affixes” tend to be accented. Stress is typically assigned to the syllable immediately before the accent, but a few areas accent the penult or the antepenult. — Souletin does its own thing with accent. Stress usually falls on the penult, but contractions can mess with this (one of the examples given in the paper is “alhába ‘daughter’
    + abs. sg. -a > alhabá ‘the daughter”’). Something similar is posited for “older… Salazarese”. Roncalese was much the same, but the stress was stem-oriented as opposed to word-oriented unless contraction occurred, and there’s some stuff about proparoxytones that Souletin didn’t have.'
