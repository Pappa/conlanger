  citation: 'Clouse (1993) reconstructs the following phonological inventory for Proto-Lakes Plain: Additionally, *ɾ is of uncertain reconstruction and is most likely an allophone of *d. For the following sound changes, a circumflexed vowel refers to an “extra-high” or “fricativized” vowel. There are a few cases where I may have either missed, misread, or put in an extraneous sound change to extra-high vowels; many of these were due to my perception of changes involving extra-high vowels being listed without a change creating them. (From Clouse, Duane (1993), “Languages of the Western Lakes Plains”. IRIAN: Bulletin of Irian Jaya XXI:1 – 17)'
