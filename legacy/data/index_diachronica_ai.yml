- section: Niger-Congo
  index: '30'
  citation: 'Hedinger (1987) reconstructs the following consonant inventory for Pre-Proto-Bantu: *’p *’c *’ɟ *’ɡ appear confined to C₁ position; *ŋ, to C₂ position. Hedinger also considers the Manenguba languages (and possibly the Mbo languages in general) as sharing a common ancestor with Proto-Bantu instead of being descended from it, although the author seems to use the abbreviation “PM” to refer to Proto-Manenguba. Due to the scarcity of available resources on Niger-Congo historical phonology, there will likely be many overlaps or contradictions in the available data, maybe more so than in other sections, even Indo-European. What is included in the Index is what is available. (From Hedinger, Robert (1987), The Manenguba Languages (Bantu A.15, Mbo Cluster) of Cameroon)'
