- section: Salishan
  index: '35'
  citation: 'Kuipers (1981) gives the following reconstruction for the Proto-Salish phoneme inventory (converted into IPA): For the following changes, the superscript numerals 1, 2, and 3 refer to low, mid, and high tones, respectively. Not all Salishan languages have all three tones; for most, there is no tone 2 (mid). Vowel pairs in between curly braces 〈{ }〉 and with a tilde between are pairs which apparently existed in some sort of ablaut-like alternation. (From Kuipers, Aert H. (1981), “On Reconstructing the Proto-Salish Sound System”. International Journal of American Linguistics 47(4):323 – 335; and Galloway, Brent (1982), “Proto-Central Salish Phonology and Sound Correspondences”. From the 17th International Conference on Salish and Neighboring Languages)'
