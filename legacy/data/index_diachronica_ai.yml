- section: Northeast Caucasian
  index: '11'
  citation: Proto-Northeast Caucasian is reconstructed as having had the following consonant inventory. Phonemes in parentheses or braces are so marked on User:Petusek’s page. Due to the inventory, the usual table format is modified. My guess is that what I’ve transcribed here as length (it’s represented by doubled consonants in the source) is probably supposed to represent some sort of fortis-lenis distinction, given that in other places I think I’ve seen these doubled consonants in initial position, although I might be wrong, as I’m not very familiar with the morphology of the languages in question. Consonants such as *tsː are written 〈tts〉 in the source; unless it’s the actual fricative that is geminate, the stop is the doubled consonant. The citation format for Nichols (2003) is modified from that found in Wikipedia contributors (2014), “Northeast Caucasian languages”. Wikipedia, the Free Encyclopedia. (From User:Petusek (2010), “User:Petusek/Drafts/Northeast Caucasian”. Wikipedia, the Free Encyclopedia.
